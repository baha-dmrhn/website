name: Build Baha Enerji Android APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "APK içinde açılacak site adresi"
        required: true
        default: "https://baha-website.onrender.com"
  push:
    branches:
      - main
    paths:
      - "BAHA-ENERJI-ANDROID/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BAHA_SITE_URL: ${{ github.event.inputs.site_url || 'https://baha-website.onrender.com' }}
      BAHA_ANDROID_KEYSTORE_BASE64: ${{ secrets.BAHA_ANDROID_KEYSTORE_BASE64 }}
      BAHA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BAHA_ANDROID_KEYSTORE_PASSWORD }}
      BAHA_ANDROID_KEY_ALIAS: ${{ secrets.BAHA_ANDROID_KEY_ALIAS }}
      BAHA_ANDROID_KEY_PASSWORD: ${{ secrets.BAHA_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare stable release signing
        shell: bash
        run: |
          if [[ -z "$BAHA_ANDROID_KEYSTORE_BASE64" || \
                -z "$BAHA_ANDROID_KEYSTORE_PASSWORD" || \
                -z "$BAHA_ANDROID_KEY_ALIAS" || \
                -z "$BAHA_ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Android release imza secret'ları eksik. README'deki dört GitHub Secret değerini ekleyin."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/baha-signing"
          printf '%s' "$BAHA_ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/baha-signing/baha-release.jks"
          echo "BAHA_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/baha-signing/baha-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: BAHA-ENERJI-ANDROID
        run: |
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew clean assembleRelease -PBAHA_SITE_URL="$BAHA_SITE_URL" --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            BAHA-ENERJI-ANDROID/app/build/outputs/apk/release/app-release.apk

      - name: Prepare installable APK
        run: |
          mkdir -p apk-output
          cp BAHA-ENERJI-ANDROID/app/build/outputs/apk/release/app-release.apk apk-output/Baha-Enerji.apk

      - name: Show APK output
        run: |
          find apk-output -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Baha-Enerji-APK
          path: apk-output/Baha-Enerji.apk
          if-no-files-found: error
