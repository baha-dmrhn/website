<!doctype html>
<html lang="tr" class="baha-loading-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1930">
  <title>Panel hazırlanıyor | Baha Enerji</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(28px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left));
      background: #0b1930;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    img {
      width: 92px;
      height: 92px;
      object-fit: contain;
      padding: 10px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 60px rgba(2, 10, 24, .32);
    }
    h1 {
      margin: 22px 0 0;
      color: #fff;
      font-size: clamp(28px, 5vw, 36px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    p {
      margin: 8px 0 0;
      color: #abbede;
      font-size: 15px;
      line-height: 1.45;
    }
    .bar {
      width: min(220px, 62vw);
      height: 3px;
      margin-top: 22px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(171, 190, 220, .18);
    }
    .bar i {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2f70ee, #68e1fd);
      animation: slide 1.05s ease-in-out infinite;
    }
    button {
      margin-top: 18px;
      padding: 11px 18px;
      border: 1px solid rgba(104, 225, 253, .35);
      border-radius: 12px;
      background: rgba(47, 112, 238, .16);
      color: #dcebff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button[hidden] { display: none; }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <img src="/suite-assets/baha-logo.png" alt="Baha Enerji">
    <h1>Baha Enerji</h1>
    <p id="panelLoadingMessage">Panel hazırlanıyor...</p>
    <div class="bar" aria-hidden="true"><i></i></div>
    <button id="panelLoadingRetry" type="button" hidden>Şimdi tekrar dene</button>
  </main>
  <script src="/panel-loading.js?v=2" defer></script>
</body>
</html>
