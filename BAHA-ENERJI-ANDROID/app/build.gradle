plugins {
    id "com.android.application"
}

def siteUrl = providers.gradleProperty("BAHA_SITE_URL")
        .orElse("https://baha-website.onrender.com")
        .get()
def releaseStorePath = System.getenv("BAHA_ANDROID_KEYSTORE_PATH") ?: ""
def releaseStorePassword = System.getenv("BAHA_ANDROID_KEYSTORE_PASSWORD") ?: ""
def releaseKeyAlias = System.getenv("BAHA_ANDROID_KEY_ALIAS") ?: ""
def releaseKeyPassword = System.getenv("BAHA_ANDROID_KEY_PASSWORD") ?: ""
def hasReleaseSigning = [
        releaseStorePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace "com.bahaenerji.app"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.bahaenerji.app"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "1.3"
        buildConfigField "String", "SITE_URL", "\"${siteUrl}\""
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.configureEach { task ->
    if (task.name == "packageRelease") {
        task.doFirst {
            if (!hasReleaseSigning) {
                throw new GradleException(
                        "Release imza bilgileri eksik. BAHA_ANDROID_KEYSTORE_* ortam değişkenlerini tanımlayın."
                )
            }
        }
    }
}
