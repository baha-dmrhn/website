plugins {
    id "com.android.application"
}

def siteUrl = providers.gradleProperty("BAHA_SITE_URL")
        .orElse("https://baha-website.onrender.com")
        .get()

android {
    namespace "com.bahaenerji.app"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.bahaenerji.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "SITE_URL", "\"${siteUrl}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
