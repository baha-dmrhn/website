name: Build Baha Enerji Android APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "APK içinde açılacak site adresi"
        required: true
        default: "https://baha-website.onrender.com"
  push:
    branches:
      - main
    paths:
      - "BAHA-ENERJI-ANDROID/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      BAHA_SITE_URL: ${{ github.event.inputs.site_url || 'https://baha-website.onrender.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: BAHA-ENERJI-ANDROID
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -PBAHA_SITE_URL="$BAHA_SITE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baha-enerji-debug-apk
          path: BAHA-ENERJI-ANDROID/app/build/outputs/apk/debug/app-debug.apk
