services:
  - type: web
    name: baha-website
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./BAHA-ENERJI-WEBSITE/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: BAHA_URETIM_SESSION_MINUTES
        value: 100
      - key: BAHA_URETIM_COOKIE_SECURE
        value: "true"
      - key: EPIAS_TIMEOUT_SECONDS
        value: 25
      - key: BAHA_URETIM_DATA_CACHE_SECONDS
        value: 300
      - key: BAHA_EPIAS_JSON_CACHE_ENABLED
        value: "true"
      - key: BAHA_EPIAS_JSON_CACHE_CURRENT_SECONDS
        value: 900
      - key: BAHA_EPIAS_JSON_CACHE_LIVE_SECONDS
        value: 300
      - key: BAHA_EPIAS_JSON_CACHE_RECENT_SECONDS
        value: 21600
      - key: BAHA_EPIAS_JSON_CACHE_HISTORY_SECONDS
        value: 315360000
      - key: BAHA_EPIAS_FORCE_REFRESH_MIN_SECONDS
        value: 300
      - key: BAHA_BG_MARKET_SECONDS
        value: 300
      - key: BAHA_BG_NEXT_PTF_SECONDS
        value: 600
      - key: BAHA_BG_CONSUMPTION_SECONDS
        value: 600
      - key: BAHA_BG_BARAJ_SECONDS
        value: 3600
      - key: BAHA_BG_BARAJ_START_HOUR
        value: 8
      - key: BAHA_BG_BARAJ_END_HOUR
        value: 19
      - key: BAHA_BG_URETIM_SECONDS
        value: 3600
      - key: BAHA_LOGIN_MAX_ATTEMPTS
        value: 5
      - key: BAHA_LOGIN_WINDOW_SECONDS
        value: 600
      - key: BAHA_LOGIN_BLOCK_SECONDS
        value: 300
